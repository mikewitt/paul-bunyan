# Keep these revs matching the versions `uv sync` resolves, or the CI lint
# job and the local hook enforce two different rulesets — a commit passes
# here and fails there. `uv run ruff --version` / `uv run black --version`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # `ruff-check`, not `ruff`: the latter is a deprecated alias for it.
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
