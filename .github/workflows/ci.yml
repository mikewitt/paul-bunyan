name: CI

on:
  push:
    branches: [daddy]
  pull_request:
  # Manual trigger, because trunk CI is otherwise impossible to re-run. Three
  # things have to be true at once for that to bite, and they were: a commit
  # message can suppress a run entirely (GitHub scans the whole message for a
  # skip directive, body included, and quoting one counts), a suppressed run
  # is never created so there is nothing to re-run, and branch protection
  # refuses the empty commit that would otherwise force one. Trunk then has no
  # verdict at all, which reads exactly like a green one.
  workflow_dispatch:

# Least privilege throughout, and no job opts back up. Nothing here writes to
# the repository: the coverage badge is served by Codacy from the report the
# `coverage` job uploads, rather than committed as a file.
permissions:
  contents: read

# A newer push makes an in-flight run's verdict stale before it lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job pins its interpreter with actions/setup-python before setup-uv,
# and the pin is deliberate. Left to itself `uv sync` resolves whatever
# satisfies requires-python, so the single-interpreter jobs below would drift
# as runners update and a version-specific failure would land in an unrelated
# PR. The matrix passes ${{ matrix.python-version }} here for the same reason
# — it is what makes the six legs genuinely six versions rather than six
# copies of whatever uv picked.
jobs:
  lint:
    # First in the chain. Every job below waits on the one before it, so a
    # failure here costs nine seconds instead of the ~12 billed minutes a full
    # fan-out spends before reporting the same thing. The trade is real and
    # accepted: a red run now names one broken job rather than all of them, so
    # a second failure only surfaces after the first is fixed.
    #
    # Its own job, not a step in the matrix below: style is a property of the
    # source, not of the OS or interpreter running it, so checking it six
    # times says the same thing six times — and reports a single misplaced
    # comma as six red legs with no check called "lint" among them.
    # None of these jobs depends on another: which one is broken is more
    # useful than making one wait on the rest, the same reasoning the matrix
    # already applies with fail-fast: false.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-extras
      # ruff lints, black formats — one tool per job, per the toolchain in
      # CLAUDE.md. `ruff format` is deliberately not run: it would be a second
      # opinion on the question black already answers.
      - run: uv run ruff check .
      - run: uv run black --check .

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-extras
      # Strict for the shipped package: it ships py.typed, so downstream users
      # type-check against these annotations and a wrong one is our bug.
      - run: uv run mypy --strict src
      # Ordinary checking for the rest. `-> None` on 150 test functions is
      # bookkeeping; a real type error in a fixture is not.
      - run: uv run mypy tests examples benchmarks

  # The tier-1 tests whose subject is elapsed time: the 1.0s legibility
  # threshold that admits a position row, and an inferred total holding across
  # consecutive real polls. `pyproject.toml` deselects them from every other
  # run so the default suite stays ~11s; a later `-m` overrides that one.
  #
  # One ubuntu leg, not the matrix, and the reason is measured rather than
  # felt. A windows leg spends 65s provisioning before it runs anything and
  # bills at 2x, where ubuntu spends 1s — so running these six times would
  # cost more than the whole rest of CI to learn nothing extra, since what
  # they test is lumberjack's timing, not the platform's. It also multiplies
  # the flake surface of the only tests here that depend on a loaded runner.
  slow-tests:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-extras
      - run: uv run pytest -m slow

  test:
    needs: typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination: a failure on one OS/version shouldn't hide
      # whether the others are healthy.
      fail-fast: false
      # One leg at a time, because the owner asked for serial CI and accepted
      # the wall-clock. Be clear about what this does *not* buy, so nobody
      # re-derives it as a saving: with `fail-fast: false` above, all six legs
      # run whether or not one fails, so serializing them cannot skip any —
      # and on a public repository GitHub-hosted minutes are free anyway. The
      # chain of `needs:` between *jobs* does prevent work from starting; this
      # line only spaces it out. `fail-fast: true` is the lever if the matrix
      # should ever stop early, at the cost of hiding which other legs failed.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-extras
      - run: uv run pytest

  bare:
    needs: slow-tests
    # Design principle 8: `pip install lumberjack` must pull in nothing, so a
    # library can instrument with zero imposed dependencies. Every leg of
    # `test` installs every extra, so without this job no `except ImportError`
    # guard in the package — rich_renderer.py's, rich_compat.py's or
    # otel.py's — ever runs in CI.
    #
    # The job name is stale (it now guards three optional dependencies, not
    # one) but deliberately unchanged: `name:` is the check name GitHub
    # reports, so renaming it orphans the required status check in trunk's
    # branch protection. Not worth blocking a merge on a settings change.
    name: bare install (no rich)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # No --all-extras: dev tooling, but none of the optional dependencies.
      - run: uv sync
      - name: Assert the optional dependencies really are absent
        # Without this the job silently becomes a duplicate of `test` the day
        # one of them turns up in the default install. Principle 9 owes a
        # degradation test per optional dependency, so all three are named.
        run: |
          uv run python - <<'EOF'
          import importlib.util, sys
          present = [
              name
              for name in ("rich", "opentelemetry", "duckdb")
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              sys.exit(
                  f"{', '.join(present)} installed; this job no longer tests "
                  "the bare install"
              )
          EOF
      - run: uv run pytest

  package:
    needs: bare
    # The wheel is the artefact users actually get, and it is assembled by
    # hatchling from a config nothing else exercises — a mistake in the
    # packages list or a missing py.typed passes every other job here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # Fails if uv.lock has drifted from pyproject.toml, which would mean
      # every other job resolved something the lockfile does not describe.
      - run: uv lock --check
      - run: uv build
      - name: Install the built wheel and use it
        # A fresh venv with no source tree on the path, so this imports the
        # wheel's contents rather than src/.
        run: |
          uv venv /tmp/wheeltest
          VIRTUAL_ENV=/tmp/wheeltest uv pip install dist/*.whl
          cd /tmp
          /tmp/wheeltest/bin/python - <<'EOF'
          import importlib.resources, logging, lumberjack
          # The tracking API before init(), in the only genuinely
          # zero-dependency environment CI has: a library instrumenting with
          # bare lumberjack installed must be inert, not broken.
          with lumberjack.task("before init", total=2) as t:
              for _ in lumberjack.track(range(2), name="items"):
                  t.advance()
          # Zero required dependencies: importing must not need the extras.
          lumberjack.init(output_mode="plain", flush_interval=0)
          logging.getLogger("smoke").warning("installed wheel works")
          store = lumberjack.current_store()
          assert store is not None
          with lumberjack.task("after init"):
              pass
          lumberjack.flush()
          rows = store.recent()
          assert len(rows) == 3, f"expected the log line and two task rows, got {len(rows)}"
          assert [r.task_event for r in rows if r.task_event] == ["start", "end"]
          lumberjack.shutdown()
          # py.typed has to be in the wheel or downstream type checking of
          # lumberjack silently does nothing.
          assert (
              importlib.resources.files("lumberjack") / "py.typed"
          ).is_file(), "py.typed missing from the wheel"
          print("wheel smoke test passed")
          EOF

  coverage:
    # Renamed from `coverage-badge` when the badge moved to Codacy. Safe to
    # rename because trunk's branch protection does not list this job —
    # unlike `bare install (no rich)` above, whose stale name has to stay.
    #
    # Coverage comes from this single ubuntu/3.12 run, not from all six
    # `test` legs. The union across legs would be a shade higher — the
    # bare-install skipif, and Windows path branches — but collecting it
    # means six `--partial` uploads plus a `final` call, which is a lot of
    # workflow for a fraction of a percent.
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --all-extras
      - run: uv run pytest --cov-report=xml

      - name: Upload coverage to Codacy
        # Skipped rather than failed when the secret is absent, which is the
        # case for pull requests from forks (GitHub withholds secrets there)
        # and for anyone who has cloned this without a Codacy project. A
        # coverage upload is not worth a red X on someone else's PR.
        #
        # The token goes through `env` because the `secrets` context is not
        # available in a step-level `if` — only `env` is — so this indirection
        # is the supported way to ask "was a secret provided?".
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          # Cobertura, which is what coverage.py's `xml` writer emits and
          # what Codacy auto-detects.
          coverage-reports: coverage.xml

      - name: Say so when coverage was not uploaded
        # The skip above is silent, and a silent skip is indistinguishable
        # from a broken upload: the job goes green either way and Codacy just
        # never shows coverage. This turns "no coverage, no explanation" into
        # an annotation naming the cause. It is not a failure — a fork PR
        # legitimately lands here.
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        if: env.CODACY_PROJECT_TOKEN == ''
        run: >-
          echo "::notice title=Coverage not uploaded::CODACY_PROJECT_TOKEN is not set for this run, so coverage was not
          sent to Codacy. Expected on pull requests from forks, where GitHub
          withholds secrets. Otherwise add the token under Settings > Secrets
          and variables > Actions, using the value from Codacy's Repository
          Settings > Coverage page."
