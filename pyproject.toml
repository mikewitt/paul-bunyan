[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lumberjack"
version = "0.1.0.dev0"
description = "Attribution, storage, and live-terminal rendering on top of stdlib logging."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Michael Witt", email = "witt.michael@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
recommended = ["rich>=13.7"]
duckdb = ["duckdb>=0.10"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.0", "pre-commit>=3.6"]

[project.urls]
Homepage = "https://github.com/mikewitt/paul-bunyan"

[tool.hatch.build.targets.wheel]
packages = ["src/lumberjack"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lumberjack --cov-report=term-missing"

[tool.coverage.run]
source = ["lumberjack"]
branch = true
