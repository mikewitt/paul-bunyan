[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lumberjack"
version = "0.1.0.dev0"
description = "Attribution, storage, and live-terminal rendering on top of stdlib logging."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Michael Witt", email = "witt.michael@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
recommended = ["rich>=13.7"]
duckdb = ["duckdb>=0.10"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.6",
    "mypy>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/mikewitt/paul-bunyan"

[tool.hatch.build.targets.wheel]
packages = ["src/lumberjack"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# `G` is not housekeeping here, it is dogfooding. G001-G004 forbid building a
# log message with an f-string, `.format()` or `+`, which keeps `record.msg`
# the *template* and `record.args` the data. lumberjack reads both as separate
# columns; an f-string destroys the template at the call site and it cannot be
# recovered. The package that depends on that discipline should be held to it.
select = ["E", "F", "I", "B", "UP", "G"]

[tool.black]
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lumberjack --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["lumberjack"]
branch = true
# The excepthook, atexit and file-backed-store paths only run in the
# subprocesses test_integration.py spawns. Without this their coverage is
# invisible, and "uncovered" stops meaning "untested".
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
