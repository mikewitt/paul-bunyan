[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lumberjack"
version = "0.1.0.dev0"
description = "Attribution, storage, and live-terminal rendering on top of stdlib logging."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Michael Witt", email = "witt.michael@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
recommended = ["rich>=13.7"]
duckdb = ["duckdb>=0.10"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.6",
    "mypy>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/mikewitt/paul-bunyan"

[tool.hatch.build.targets.wheel]
packages = ["src/lumberjack"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# `G` is not housekeeping here, it is dogfooding. G001-G004 forbid building a
# log message with an f-string, `.format()` or `+`, which keeps `record.msg`
# the *template* and `record.args` the data. lumberjack reads both as separate
# columns; an f-string destroys the template at the call site and it cannot be
# recovered. The package that depends on that discipline should be held to it.
#
# `S` is flake8-bandit, and selecting it here is bandit's ruleset moving to the
# one place that can scope it. `.codacy.yaml` wants to say "an assert is fine in
# tests/ and nowhere else" and has no vocabulary for it — its own comment says
# so: "Individual patterns can only be disabled in the Codacy web UI, so path
# scoping is the whole of what this file can express." It therefore had to
# exclude `tests/**` wholesale, which cost the suite every *other* finding those
# engines produce. `per-file-ignores` below says the intended thing exactly.
#
# Verified rule-for-rule and site-for-site against what `.codacy.yaml` documents
# bandit reporting: S110/S608 in src/, S606 in scripts/, S101/S108/S603/S102 in
# tests/. Nothing is given up by moving it here, and something is gained — an
# `assert` reaching src/ now fails pre-commit and the required `lint` job rather
# than being caught by Codacy after merge.
# `RUF100` is what stops any of the above rotting. Three `# noqa`s in this repo
# were inert because their rules were never selected, and an unenforced
# suppression is indistinguishable from a working one — the same failure mode
# `.codacy.yaml` records for silently-ignored engine keys. `SLF001` and `BLE001`
# are selected for exactly that reason: they were already being suppressed by
# hand, so either they are real rules or the comments were decoration.
select = ["E", "F", "I", "B", "UP", "G", "S", "RUF100", "SLF001", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# S101: in a pytest suite the assert IS the test, and S101's actual concern —
# asserts stripped under `python -O` — does not apply to code nothing runs under
# -O. Every other `S` rule still applies to tests/; only this one is exempt,
# which is precisely the distinction a path exclusion could not draw.
#
# SLF001: tests reaching into renderer and model internals is a real finding,
# not a false positive — it is issue #45, which wants those tests asserting on a
# rendered frame instead. Suppressing all 31 inline would bury that; exempting
# the directory keeps the rule enforced where it is actionable today (src/) and
# leaves #45 to fix the tests rather than annotate them.
"tests/**" = ["S101", "SLF001"]
# S608 on `_INSERT_SQL`, exempted here rather than with a `# noqa` on the line,
# and the indirection is the point. That statement is a pre-existing finding
# `.codacy.yaml` has already assessed and kept — `_COLUMNS` is a module-level
# tuple of literal column names, values go through `?` placeholders, and the
# parity tests pin `_COLUMNS` against the real table. It is 85 characters, so a
# trailing `# noqa: S608` overflows the line and forces a reformat.
#
# Reformatting it is what must not happen. Codacy counts issues on *changed*
# lines, so rewrapping a line that has been accepted for months republishes its
# findings as new ones introduced by whatever PR touched it — measured on #76,
# where the split briefly produced three highs and a medium against a statement
# nobody had changed the meaning of. Exempting by path leaves the line byte for
# byte as it was, which is what keeps it out of the diff.
"src/lumberjack/store.py" = ["S608"]

[tool.black]
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lumberjack --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["lumberjack"]
branch = true
# The excepthook, atexit and file-backed-store paths only run in the
# subprocesses test_exit_paths.py spawns. Without this their coverage is
# invisible, and "uncovered" stops meaning "untested".
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
