---
# Codacy runs outside .github/workflows/ci.yml, alongside CodeQL.
#
# Bandit is not run over `tests/`. Every finding it produced there was a
# false positive for a test suite, and there were 437 of them drowning any
# real signal:
#
#   B101  assert_used            — 437, all in tests. The rule is about
#                                  asserts being stripped under `python -O`
#                                  in *production* code; in a pytest suite
#                                  the assert IS the test.
#   B603  subprocess_without_    — test_integration.py and test_toolchain.py
#         shell_equals_true        launch `sys.executable` deliberately, to
#                                  exercise atexit and excepthook paths that
#                                  cannot run in-process.
#   B404  import_subprocess      — same two files, same reason.
#   B108  hardcoded_tmp_dir      — "/tmp/foo.py" in row fixtures is a fake
#                                  `pathname` value on a record; nothing is
#                                  opened, created or written.
#
# Scoped to the bandit engine rather than a global `exclude_paths`, so
# complexity and duplication still cover the test suite.
#
# `src/` is deliberately NOT excluded. Its two findings are real code that
# was looked at and kept:
#   B110  try_except_pass        — teardown.py and pump.py, every instance
#                                  commented: a bug in lumberjack's own
#                                  cleanup must never hide a user's
#                                  traceback, so the swallow is the point.
#   B608  hardcoded_sql          — `_INSERT_SQL` is built from `_COLUMNS`, a
#                                  module-level tuple of literal column
#                                  names. Values go through `?` placeholders,
#                                  and the parity tests pin `_COLUMNS`
#                                  against the real table.
#
# `examples/` is not excluded either, and its two B101s are now **fixed**
# rather than kept. Both were `assert store is not None`, narrowing a type
# for mypy before `.recent()`; `python -O` strips an assert, so the narrowing
# vanished and a None reached the call. Nobody runs the examples under -O,
# which is why this sat here as a documented acceptance — but the warning was
# never wrong, the fix is two lines, and `if store is None: raise` narrows
# for mypy exactly as well. Keeping the path in scope is what surfaced it.
#
# That is the intended use of leaving `src/` and `examples/` scanned:
# excluding more than the noise would defeat the point of the tool, and the
# findings that remain are meant to be re-read rather than inherited.
#
# Individual patterns can only be disabled in the Codacy web UI, so path
# scoping is the whole of what this file can express. After this, bandit
# reports 10 findings instead of 447, and each of the 10 has been read.
#
# `uv.lock` is excluded from every engine, not just bandit. It is generated by
# `uv lock` and regenerated wholesale — nobody edits it, so a finding in it is
# not something anyone can act on, and `uv lock --check` in the `package` job
# is what actually guards it. It also trips duplication detection heavily, by
# design: a lockfile is thousands of near-identical dependency stanzas, and
# counting those as duplicated code makes the repo-wide duplication figure
# meaningless.
# `benchmarks/` and `scripts/` are excluded on the same grounds as `tests/`:
# development tooling, not shipped in the wheel, and never run by a user of
# the package. What each was flagged for:
#
#   B404  import_subprocess    — `benchmarks/capture.py` shelled out once, to
#   B603  subprocess_without_    `git rev-parse --short HEAD`, so a recorded
#         shell_equals_true      baseline says which revision produced it.
#   B607  start_process_with_    Fixed argv list, no user input anywhere near
#         partial_path           it, wrapped in try/except and best-effort by
#                                design — a missing `git` returned None.
#   B101  assert_used          — `assert __doc__ is not None` narrows a type
#                                for mypy before `__doc__.split()`.
#   B606  start_process_       — `scripts/record_demo.py` launches the demo
#         without_a_shell        under a pty so it can record the live display
#                                as a GIF. Starting a process is not incidental
#                                to it — it is the entire job — and the argv is
#                                a fixed list built from `sys.executable` and a
#                                path derived from `__file__`, with no shell and
#                                nothing user-supplied anywhere near it.
#
# The same "excluding more than the noise defeats the tool" test applies: this
# is two files of dev tooling, and `src/` and `examples/` both stay in scope.
exclude_paths:
  - "uv.lock"

# Engine scoping is per engine, which is easy to forget and was: `tests/**`
# was excluded from bandit and then a *different* engine flagged
# `subprocess.run([sys.executable, ...])` in tests/test_benchmark.py as a
# non-static argv. The bandit block does not cover it.
#
# Engine keys are a closed list, so guessing one is a silent no-op rather than
# an error. `opengrep` is the real name — `semgrep` is not on Codacy's list at
# all and a stanza under it did nothing. `pylintpython3` likewise: `pylint` is
# accepted as a deprecated alias, but the current name is the one to write.
# The list is in codacy/docs, `repositories-configure/codacy-configuration-file`;
# read it before adding a key rather than inferring the name from the finding's
# wording, which is how a dead `semgrep` stanza sat here looking load-bearing.
#
# The test launches the benchmark as a real child process on purpose — that
# is what proves the script still runs end to end as a script, which an
# in-process call to `main()` would not. `sys.executable` and a `Path` built
# from `__file__` are the only non-literal parts, there is no shell, and no
# input reaches it. Same category as the B603 entry above.
#
# `benchmarks/` no longer launches anything: `_git_commit()` reads `.git`
# directly rather than shelling out to `git rev-parse`. It is kept in the
# list because a benchmark is dev tooling either way, not because it still
# has a finding.
#
# `pylintpython3` is listed for one finding, and the engine is the whole
# lesson: the same `exec` is reported by *both* bandit (B102) and pylint
# (W0122), so excluding it from one engine and reading the remaining report as
# clean is a mistake this file has now made once. Match on the finding, never
# on the tool that happened to phrase it.
#
#   W0122  exec-used            — `tests/test_static.py` compiles a module of
#                                 deliberately awkward multi-line log calls and
#                                 runs it, so the assertion is against real
#                                 `LogRecord`s. The AST keys a call site on the
#                                 line the *attribute* ends on rather than on
#                                 `Call.lineno`, and executing the source is
#                                 what pins that against CPython instead of
#                                 against a remembered rule. Same category as
#                                 B101 above: the `exec` is the test.
#
# The name is load-bearing in a way the docs undersell. They say the deprecated
# aliases "remain accepted", and for `pylint` that is not true of an
# `exclude_paths` block: the stanza was ignored in silence, the finding stayed,
# and only `pylintpython3` cleared it. So an exclusion that appears to do
# nothing is a wrong key until proven otherwise — a pull request's own analysis
# *does* honour a new engine block, which is what makes that a same-round test
# rather than something you find out at merge.
engines:
  bandit:
    exclude_paths:
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
  opengrep:
    exclude_paths:
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
  pylintpython3:
    exclude_paths:
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
