---
# Codacy runs outside .github/workflows/ci.yml, alongside CodeQL.
#
# There is no `bandit` block any more, and its absence is the point. Bandit's
# ruleset now lives in ruff, as `S` in `[tool.ruff.lint]`, because ruff can say
# the thing this file could not.
#
# What this file used to say was "exclude `tests/**` from bandit", and the
# reason was one rule: B101 `assert_used` fired 437 times — in a pytest suite
# the assert IS the test — and drowned everything else. The exclusion was never
# what anyone meant. What anyone meant was "an assert is fine in tests/ and
# nowhere else", and the constraint that made that unsayable is still true:
#
#   Individual patterns can only be disabled in the Codacy web UI, so path
#   scoping is the whole of what this file can express.
#
# So the whole directory went, and with it every *other* finding bandit would
# have reported there. That was the real cost, and it was paid silently.
#
# `ruff --select S` was checked against what bandit reports, rule for rule and
# site for site, and reproduces it exactly: S110/S608 in src/, S606 in scripts/,
# S101/S108/S603/S102 in tests/. Ruff also has `per-file-ignores`, so
# `pyproject.toml` now says "S101 is exempt in tests/, every other S rule is
# not" — one line, in the repo, enforced by pre-commit and the required `lint`
# job. That is strictly stronger than what was here: an `assert` reaching `src/`
# used to pass `lint` and be caught by Codacy only after merge.
#
# Two consequences worth stating rather than discovering:
#
#   - The remaining findings are suppressed inline, at the code, with the reason
#     beside them — `# noqa: S110, BLE001 - swallowing is the point` reads better
#     than the same sentence in a config file three directories away. Where a
#     line needs to satisfy both tools it carries both markers, because bandit
#     reads `# nosec` and has never read `# noqa`.
#
#     That last sentence was a prediction and is now measured, on PR #76, which
#     dropped the bandit block with only inline markers in place to find out.
#     Two results worth keeping:
#
#       `# nosec` is honoured. B603 (x4), B102 and B606 all went to zero, and
#       `bandit -r src tests scripts benchmarks examples` confirms it locally.
#       So a finding here can be answered at the code rather than by a path.
#
#       `# noqa` is not, and Codacy said so itself: its review left a suggestion
#       on `store.py` reading "Codacy's Bandit engine continues to flag it
#       because it does not recognize the Ruff-specific `# noqa: S608`". So a
#       line that must satisfy both tools needs both markers.
#
#     B101 itself is not answered by either marker, and is not meant to be. It
#     is skipped wholesale in `bandit.yaml`, next to this file, because 852
#     `# nosec B101` comments on 852 asserts would encode nothing about the code
#     — only that a suppression was once required. See that file for why
#     skipping the rule costs nothing and why `exclude_dirs` was refused.
#
#     Bandit auto-discovers **no** config file. Not `pyproject.toml` (a
#     `[tool.bandit]` block there is read only with an explicit `-c`), and not
#     `.bandit` either — both were tested against bandit directly. Codacy is
#     what supplies the `-c`, for the filenames it recognises, and only when the
#     tool's "use configuration file" setting is on. It already is here, for
#     Bandit and for Ruff, which is why `bandit.yaml` needed no UI change and
#     why Codacy's Ruff reports nothing: it reads `pyproject.toml` and agrees
#     with the local gate.
#
#     A third result, learned the expensive way on the same PR. `_INSERT_SQL`
#     was 85 characters, so adding `# noqa: S608` overflowed the line and forced
#     a rewrap — and rewrapping it republished a finding nobody had changed the
#     meaning of as *three highs and a medium introduced by the PR*, because
#     Codacy counts issues on changed lines. The line is now byte for byte what
#     it was, and S608 is exempted by path in `pyproject.toml` instead.
#
#     The general rule, worth more than the instance: **do not reformat a line
#     carrying an accepted finding.** Touching it is what makes it new. Where a
#     suppression does not fit, put it in `per-file-ignores` rather than
#     reflowing the code around it.
#
#     Before `bandit.yaml` existed, the 852 B101s bandit reported in `tests/`
#     mostly did *not* show up as PR findings — Codacy counts issues on changed
#     lines, and only three assert lines were touched. Those three were the
#     "3 high" the PR chased for hours. Read a quiet PR summary accordingly: it
#     means "nothing you edited is flagged", never "the directory is clean".
#   - B108 has no suppression anywhere, because it was fixed instead. The fake
#     `pathname` in the row fixtures was "/tmp/foo.py"; it is now
#     "/nonexistent/foo.py". The tests require a path with no source on disk —
#     that is the whole reason the fixture exists — and `/tmp` is a real
#     directory where `foo.py` could plausibly turn up. The rule was right.
#
# `src/` and `examples/` were never excluded and still are not. `src/`'s B110
# and B608 stay visible in Codacy on purpose, exactly as before: they are meant
# to be re-read rather than inherited, and neither line was touched by the move
# to ruff. Their ruff-side counterparts are suppressed — B110's at the line,
# B608's by path — but nothing was added to make Codacy stop reporting either.
#
# `examples/`' two B101s were fixed
# rather than kept, back when this file still had a bandit block — both were
# `assert store is not None` narrowing a type for mypy, which `python -O`
# strips, so the narrowing vanished and a None reached the call. Keeping the
# path in scope is what surfaced it. That is the argument for excluding as
# little as possible, and it is why the answer here was to move the rule rather
# than to widen the exclusion.
#
# `uv.lock` is excluded globally, from every engine. It is generated by
# `uv lock` and regenerated wholesale — nobody edits it, so a finding in it is
# not something anyone can act on, and `uv lock --check` in the `package` job
# is what actually guards it. It also trips duplication detection heavily, by
# design: a lockfile is thousands of near-identical dependency stanzas, and
# counting those as duplicated code makes the repo-wide duplication figure
# meaningless.
# `benchmarks/` and `scripts/` are excluded from the engines below on the same
# grounds `tests/` was: development tooling, not shipped in the wheel, and never
# run by a user of the package. They are no longer excluded from bandit, because
# nothing is — `scripts/record_demo.py` carries `# noqa: S606  # nosec B606` at
# the one line that needs it (launching the demo under a pty is not incidental
# to that script, it is the entire job; the argv is a fixed list built from
# `sys.executable` and a path derived from `__file__`, no shell, nothing
# user-supplied). `benchmarks/` has no findings at all now: `_git_commit()`
# reads `.git` directly rather than shelling out to `git rev-parse`.
#
# The same "excluding more than the noise defeats the tool" test applies, and
# it is what removing the bandit block was in service of.
exclude_paths:
  - "uv.lock"

# Engine scoping is per engine, which is easy to forget and was: `tests/**`
# was excluded from bandit and then a *different* engine flagged
# `subprocess.run([sys.executable, ...])` in tests/test_benchmark.py as a
# non-static argv. A bandit block never covered it, which is why these two
# outlived it.
#
# Engine keys are a closed list, so guessing one is a silent no-op rather than
# an error. `opengrep` is the real name — `semgrep` is not on Codacy's list at
# all and a stanza under it did nothing. `pylintpython3` likewise: `pylint` is
# accepted as a deprecated alias, but the current name is the one to write.
# The list is in codacy/docs, `repositories-configure/codacy-configuration-file`;
# read it before adding a key rather than inferring the name from the finding's
# wording, which is how a dead `semgrep` stanza sat here looking load-bearing.
#
# The test launches the benchmark as a real child process on purpose — that
# is what proves the script still runs end to end as a script, which an
# in-process call to `main()` would not. `sys.executable` and a `Path` built
# from `__file__` are the only non-literal parts, there is no shell, and no
# input reaches it. Same category as the B603 entry above.
#
# `benchmarks/` no longer launches anything: `_git_commit()` reads `.git`
# directly rather than shelling out to `git rev-parse`. It is kept in the
# list because a benchmark is dev tooling either way, not because it still
# has a finding.
#
# `pylintpython3` is listed for one finding, and the engine is the whole
# lesson: the same `exec` is reported by *both* bandit (B102) and pylint
# (W0122), so excluding it from one engine and reading the remaining report as
# clean is a mistake this file has now made once. Match on the finding, never
# on the tool that happened to phrase it.
#
#   W0122  exec-used            — `tests/test_static.py` compiles a module of
#                                 deliberately awkward multi-line log calls and
#                                 runs it, so the assertion is against real
#                                 `LogRecord`s. The AST keys a call site on the
#                                 line the *attribute* ends on rather than on
#                                 `Call.lineno`, and executing the source is
#                                 what pins that against CPython instead of
#                                 against a remembered rule. Same category as
#                                 the assert rule this file used to exclude
#                                 `tests/**` for: the `exec` is the test.
#
# The name is load-bearing in a way the docs undersell. They say the deprecated
# aliases "remain accepted", and for `pylint` that is not true of an
# `exclude_paths` block: the stanza was ignored in silence, the finding stayed,
# and only `pylintpython3` cleared it. So an exclusion that appears to do
# nothing is a wrong key until proven otherwise — a pull request's own analysis
# *does* honour a new engine block, which is what makes that a same-round test
# rather than something you find out at merge.
engines:
  opengrep:
    exclude_paths:
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
  pylintpython3:
    exclude_paths:
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
